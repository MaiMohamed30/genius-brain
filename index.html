<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🏝️ أرخبيل الرياضيات - النسخة الاحترافية</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#fff;
    text-align:center;
}

/* الخريطة */
.map{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.island{
    width:200px;
    height:130px;
    margin:15px;
    border-radius:20px;
    background:linear-gradient(135deg,#ff9800,#ff5722);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.island:hover{
    transform:scale(1.1) rotate(1deg);
}

/* اختيار المستوى */
.levels{
    display:none;
    margin-top:30px;
}

.level-btn{
    background:#4CAF50;
    margin:10px;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}

/* اللعبة */
.game{
    display:none;
    padding:20px;
}

.card{
    background:#fff;
    color:#000;
    padding:20px;
    border-radius:15px;
    max-width:650px;
    margin:auto;
}

.choice{
    display:block;
    margin:10px auto;
    padding:10px;
    width:80%;
    border-radius:10px;
    background:#eee;
    cursor:pointer;
}

.choice:hover{background:#ddd;}

.correct{background:#4CAF50 !important; color:#fff;}
.wrong{background:#f44336 !important; color:#fff;}

.progress{
    height:12px;
    background:#ccc;
    border-radius:10px;
    margin:10px;
}
.bar{
    height:100%;
    width:0%;
    background:#4CAF50;
}

.timer{
    font-size:18px;
    color:#ffeb3b;
}

.stars{
    font-size:20px;
}
</style>
</head>

<body>

<h1>🏝️ أرخبيل الرياضيات</h1>
<h3>جزيرة الكسور</h3>

<div id="map" class="map"></div>

<div id="levels" class="levels">
    <h2 id="areaName"></h2>
    <button class="level-btn" onclick="startGame('easy')">سهل</button>
    <button class="level-btn" onclick="startGame('medium')">متوسط</button>
    <button class="level-btn" onclick="startGame('hard')">صعب</button>
    <br><br>
    <button onclick="backMap()">رجوع</button>
</div>

<div id="game" class="game">
    <div class="card">
        <div class="timer">⏱️ <span id="time">15</span></div>
        <div class="stars" id="stars"></div>
        <div id="score"></div>
        <div class="progress"><div id="bar" class="bar"></div></div>
        <h2 id="q"></h2>
        <div id="choices"></div>
    </div>
</div>

<div id="end" class="game">
    <h2 id="endText"></h2>
    <button onclick="backMap()">رجوع للخريطة</button>
</div>

<script>
const areas = ["مفهوم الكسر","توحيد المقامات","الجمع","الطرح","مسائل تطبيقية"];

let selectedArea=0;
let questions=[];
let index=0;
let score=0;
let stars=0;
let timer;
let timeLeft=15;

/* خريطة */
const map=document.getElementById("map");
areas.forEach((a,i)=>{
    let div=document.createElement("div");
    div.className="island";
    div.innerText=a;
    div.onclick=()=>openLevels(i);
    map.appendChild(div);
});

function openLevels(i){
    selectedArea=i;
    document.getElementById("map").style.display="none";
    document.getElementById("levels").style.display="block";
    document.getElementById("areaName").innerText=areas[i];
}

/* توليد أسئلة */
function generate(level){
    let arr=[];
    let max= level==="easy"?5: level==="medium"?8:12;

    for(let i=0;i<15;i++){
        let a=Math.floor(Math.random()*max)+1;
        let b=Math.floor(Math.random()*max)+1;

        if(selectedArea===2){
            arr.push({
                q:`${a}/${b} + ${a}/${b} = ؟`,
                choices:[`${2*a}/${b}`,`${a}/${b}`,`${a+b}/${b}`],
                answer:0
            });
        }
        else if(selectedArea===3){
            arr.push({
                q:`${a*2}/${b} - ${a}/${b} = ؟`,
                choices:[`${a}/${b}`,`${b}/${a}`,`${a*2}/${b}`],
                answer:0
            });
        }
        else{
            arr.push({
                q:`أي كسر أكبر؟`,
                choices:[`${a}/${b}`,`${b}/${a}`,`1/${a}`],
                answer:0
            });
        }
    }
    return arr;
}

function startGame(level){
    questions=generate(level);
    index=0;
    score=0;
    stars=0;

    document.getElementById("levels").style.display="none";
    document.getElementById("game").style.display="block";

    next();
}

function next(){
    let qObj=questions[index];
    document.getElementById("q").innerText=qObj.q;

    let ch=document.getElementById("choices");
    ch.innerHTML="";

    qObj.choices.forEach((c,i)=>{
        let btn=document.createElement("div");
        btn.innerText=c;
        btn.className="choice";
        btn.onclick=()=>answer(btn,i);
        ch.appendChild(btn);
    });

    timeLeft=15;
    startTimer();
    updateUI();
}

function answer(btn,i){
    clearInterval(timer);

    let correct=questions[index].answer;

    if(i===correct){
        btn.classList.add("correct");
        score+=10;
        stars++;
        beep(700);
    }else{
        btn.classList.add("wrong");
        beep(200);
    }

    setTimeout(()=>{
        index++;
        if(index<questions.length){
            next();
        }else{
            endGame();
        }
    },800);
}

function startTimer(){
    document.getElementById("time").innerText=timeLeft;
    timer=setInterval(()=>{
        timeLeft--;
        document.getElementById("time").innerText=timeLeft;

        if(timeLeft<=0){
            clearInterval(timer);
            index++;
            if(index<questions.length){
                next();
            }else{
                endGame();
            }
        }
    },1000);
}

function updateUI(){
    document.getElementById("score").innerText="النقاط: "+score;
    document.getElementById("stars").innerText="⭐".repeat(stars);
    document.getElementById("bar").style.width=(index/15*100)+"%";
}

function beep(freq){
    let ctx=new AudioContext();
    let osc=ctx.createOscillator();
    osc.frequency.value=freq;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(()=>osc.stop(),150);
}

function endGame(){
    document.getElementById("game").style.display="none";
    document.getElementById("end").style.display="block";

    let starsCount = stars>=12? "⭐⭐⭐": stars>=8? "⭐⭐": "⭐";

    document.getElementById("endText").innerText=
    `🎉 انتهيت!
النقاط: ${score}
تقييمك: ${starsCount}`;

    localStorage.setItem("best_"+selectedArea, score);
}

function backMap(){
    document.getElementById("end").style.display="none";
    document.getElementById("game").style.display="none";
    document.getElementById("levels").style.display="none";
    document.getElementById("map").style.display="flex";
}
</script>

</body>
</html>
